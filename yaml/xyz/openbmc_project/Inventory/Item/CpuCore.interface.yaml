description: >
    Implement to provide CPU core attributes.
properties:
    - name: Microcode
      type: uint32
      description: >
          The microcode information for this processor
      default: 0


associations:
    - name: contained_by
      description: >
          Objects that implement CpuCore can optionally implement the
          'contained_by' association to provide a link to exactly one Cpu which
          physically contains it.
      reverse_name: containing
      required_endpoint_interfaces:
          - xyz.openbmc_project.Inventory.Item.Cpu
